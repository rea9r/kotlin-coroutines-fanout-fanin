  <rect x="440" y="44" width="158" height="30" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/><text x="519.0" y="64.0" text-anchor="middle" fill="#172B4D" font-size="13">通知</text>
  <text x="616" y="64" fill="#6B778C" font-size="13">合計 300ms</text>

