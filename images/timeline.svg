<svg width="720" height="232" viewBox="0 0 720 232" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
  <line x1="280" y1="34" x2="280" y2="200" stroke="#C6CBD4" stroke-width="1" stroke-dasharray="4 4"/>
