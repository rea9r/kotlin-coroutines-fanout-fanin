<svg width="720" height="252" viewBox="0 0 720 252" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
  <defs><marker id="ta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B3BAC5"/></marker></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <line x1="120" y1="34" x2="120" y2="204" stroke="#C6CBD4" stroke-width="1" stroke-dasharray="4 4"/>
