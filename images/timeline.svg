  <rect x="120" y="44" width="158" height="30" rx="6" fill="#EBECF0" stroke="#C1C7D0" stroke-width="1.3"/><text x="199" y="64" text-anchor="middle" fill="#42526E" font-size="13">ユーザー</text>
  <rect x="280" y="44" width="158" height="30" rx="6" fill="#EBECF0" stroke="#C1C7D0" stroke-width="1.3"/><text x="359" y="64" text-anchor="middle" fill="#42526E" font-size="13">投稿</text>
  <rect x="440" y="44" width="158" height="30" rx="6" fill="#EBECF0" stroke="#C1C7D0" stroke-width="1.3"/><text x="519" y="64" text-anchor="middle" fill="#42526E" font-size="13">通知</text>
  <text x="616" y="64" fill="#6B778C" font-size="13">合計 300ms</text>

  <rect x="118" y="106" width="162" height="96" rx="6" fill="#E3FCEF" opacity="0.18"/>
  <text x="36" y="150" fill="#6B778C" font-size="14">並行</text>
  <rect x="120" y="112" width="158" height="26" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/><text x="199" y="130" text-anchor="middle" fill="#172B4D" font-size="13">ユーザー</text>
  <rect x="120" y="142" width="158" height="26" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/><text x="199" y="160" text-anchor="middle" fill="#172B4D" font-size="13">投稿</text>
  <rect x="120" y="172" width="158" height="26" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/><text x="199" y="190" text-anchor="middle" fill="#172B4D" font-size="13">通知</text>
  <text x="292" y="146" fill="#6B778C" font-size="13">3 本が重なって 100ms</text>
  <text x="292" y="166" fill="#8993A4" font-size="11.5">同じ時間帯（0〜100ms）に待ちが重なる</text>

  <line x1="120" y1="216" x2="620" y2="216" stroke="#C1C7D0" stroke-width="1" marker-end="url(#ta)"/>
  <text x="628" y="220" fill="#97A0AF" font-size="10">時間</text>
  <text x="360" y="242" text-anchor="middle" fill="#6B778C" font-size="12.5">3 つが同じ時間帯に進むので、合計ではなく 1 本分（100ms）で終わる</text>
