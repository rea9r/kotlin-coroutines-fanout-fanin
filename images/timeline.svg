  <rect x="120" y="112" width="158" height="26" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/><text x="199.0" y="130.0" text-anchor="middle" fill="#172B4D" font-size="13">ユーザー</text>
  <rect x="120" y="142" width="158" height="26" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/><text x="199.0" y="160.0" text-anchor="middle" fill="#172B4D" font-size="13">投稿</text>
