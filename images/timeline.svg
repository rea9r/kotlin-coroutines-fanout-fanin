  <line x1="280" y1="34" x2="280" y2="204" stroke="#C6CBD4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="280" y="26" text-anchor="middle" fill="#8993A4" font-size="11" class="mono">100ms</text>
