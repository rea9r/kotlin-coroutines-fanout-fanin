  <text x="360" y="218" text-anchor="middle" fill="#172B4D" font-size="13">API 呼び出し</text>
  <text x="360" y="330" text-anchor="middle" fill="#6B778C" font-size="12.5">外側から内側へ：全体の締め切り ⊃ 再試行 ⊃ permit（同時数）⊃ 試行の時間制限 ⊃ 呼び出し</text>
