<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A94A6"/></marker></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>

  <text x="400" y="26" text-anchor="middle" fill="#5E6C84" font-size="14" font-weight="700">キャンセルは協調的：止まるのは、次に <tspan class="mono">isActive</tspan> を確認したとき</text>
  <text x="400" y="44" text-anchor="middle" fill="#6B778C" font-size="10.5"><tspan class="mono">cancel()</tspan> は Job の <tspan class="mono">isActive</tspan> を false にするだけ（キャンセル要求）。その場では止まらない</text>

  <!-- cancel() -> mark -->
  <rect x="40" y="58" width="196" height="38" rx="8" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
  <text x="138" y="75" text-anchor="middle" fill="#172B4D" font-size="10.5" class="mono">cancel()</text>
  <text x="138" y="90" text-anchor="middle" fill="#42526E" font-size="9"><tspan class="mono">withTimeout</tspan> の期限切れも同じ</text>
  <path d="M236,77 L298,77" fill="none" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="267" y="71" text-anchor="middle" fill="#7A869A" font-size="9">false にする</text>
  <rect x="304" y="56" width="252" height="42" rx="8" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.3"/>
  <text x="430" y="75" text-anchor="middle" fill="#403294" font-size="11" class="mono">isActive = false</text>
  <text x="430" y="91" text-anchor="middle" fill="#5243AA" font-size="9">Job が「キャンセル要求」の状態に</text>
  <text x="568" y="72" fill="#6B778C" font-size="9.5">要求を立てるだけで、</text>
  <text x="568" y="88" fill="#6B778C" font-size="9.5">その場では止まらない。</text>

  <!-- still running -->
  <path d="M430,98 L430,116" fill="none" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="444" y="112" fill="#7A869A" font-size="9">要求のあと</text>
  <rect x="40" y="118" width="720" height="28" rx="6" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.2"/>
  <text x="400" y="136" text-anchor="middle" fill="#172B4D" font-size="10.5">キャンセル要求のあとも、コルーチンはその場で止まらず走り続ける</text>
  <text x="400" y="161" text-anchor="middle" fill="#5E6C84" font-size="9.5" font-weight="600">コルーチンの中身しだいで、次の 3 通りに分かれる</text>

  <!-- L1: throwing read -->
  <circle cx="54" cy="189" r="9" fill="#E3FCEF" stroke="#57D9A3"/><text x="54" y="193" text-anchor="middle" fill="#186A3B" font-size="10">1</text>
  <text x="68" y="185" fill="#172B4D" font-size="10" font-weight="600">中断・</text>
  <text x="68" y="198" fill="#172B4D" font-size="10" font-weight="600">明示確認</text>
  <rect x="158" y="168" width="270" height="42" rx="6" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.1"/>
  <text x="293" y="185" text-anchor="middle" fill="#42526E" font-size="10" class="mono">delay ・ ensureActive() ・ yield()</text>
  <text x="293" y="200" text-anchor="middle" fill="#5243AA" font-size="9.5">中断や明示確認で isActive を確認</text>
  <path d="M430,189 L456,189" fill="none" stroke="#8A94A6" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="458" y="168" width="326" height="42" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/>
  <rect x="726" y="172" width="50" height="16" rx="8" fill="#36B37E"/><text x="751" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9">throw</text>
  <text x="466" y="186" fill="#172B4D" font-size="10"><tspan class="mono">CancellationException</tspan> を投げて</text>
  <text x="466" y="202" fill="#186A3B" font-size="10">スタックを遡り、finally を実行して終わる</text>

  <!-- L2: non-throwing read -->
  <circle cx="54" cy="237" r="9" fill="#E3FCEF" stroke="#57D9A3"/><text x="54" y="241" text-anchor="middle" fill="#186A3B" font-size="10">2</text>
  <text x="68" y="233" fill="#172B4D" font-size="10" font-weight="600">非throw の</text>
  <text x="68" y="246" fill="#172B4D" font-size="10" font-weight="600">確認</text>
  <rect x="158" y="216" width="270" height="42" rx="6" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.1"/>
  <text x="293" y="233" text-anchor="middle" fill="#42526E" font-size="10.5" class="mono">while (isActive) { … }</text>
  <text x="293" y="248" text-anchor="middle" fill="#5243AA" font-size="9.5">非throw の確認で isActive を確認</text>
  <path d="M430,237 L456,237" fill="none" stroke="#8A94A6" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="458" y="216" width="326" height="42" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/>
  <rect x="708" y="220" width="68" height="16" rx="8" fill="#E3FCEF" stroke="#57D9A3"/><text x="742" y="232" text-anchor="middle" fill="#186A3B" font-size="9">非throw</text>
  <text x="466" y="234" fill="#186A3B" font-size="10"><tspan class="mono">false</tspan> が返るだけ。例外は投げない</text>
  <text x="466" y="250" fill="#186A3B" font-size="10">自分でループを抜けて終わる（巻き戻しなし）</text>

  <!-- L3: no read place -->
  <circle cx="54" cy="285" r="9" fill="#FFF7E6" stroke="#FFAB00"/><text x="54" y="289" text-anchor="middle" fill="#7A4D00" font-size="10">3</text>
  <text x="68" y="281" fill="#172B4D" font-size="10" font-weight="600">確認する</text>
  <text x="68" y="294" fill="#172B4D" font-size="10" font-weight="600">場所なし</text>
  <rect x="158" y="264" width="270" height="42" rx="6" fill="#FFF7E6" stroke="#FFAB00" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="293" y="281" text-anchor="middle" fill="#7A4D00" font-size="10">CPU ループ／同期ブロッキング</text>
  <text x="293" y="296" text-anchor="middle" fill="#7A4D00" font-size="9.5">isActive を確認する場所がない</text>
  <path d="M430,285 L456,285" fill="none" stroke="#8A94A6" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="458" y="264" width="326" height="42" rx="6" fill="#FFF7E6" stroke="#FFAB00" stroke-width="1.3"/>
  <rect x="704" y="268" width="72" height="16" rx="8" fill="#FFF7E6" stroke="#FFAB00"/><text x="740" y="280" text-anchor="middle" fill="#7A4D00" font-size="9">走り切る</text>
  <text x="466" y="282" fill="#7A4D00" font-size="10">最後まで走り切ってから戻る</text>
  <text x="466" y="298" fill="#B26A00" font-size="9.5">停止しない（<tspan class="mono">cancel</tspan>・<tspan class="mono">withTimeout</tspan> も効かない）</text>

  <!-- measurement strip -->
  <line x1="16" y1="322" x2="784" y2="322" stroke="#EBECF0" stroke-width="1"/>
  <text x="16" y="340" fill="#5E6C84" font-size="10.5" font-weight="600">実測（<tspan class="mono">withTimeoutOrNull(100)</tspan> ・ <tspan class="mono">Dispatchers.Default</tspan>）</text>
  <line x1="257" y1="352" x2="257" y2="398" stroke="#6B778C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="257" y="349" text-anchor="middle" fill="#6B778C" font-size="9">100ms 期限</text>
  <rect x="150" y="358" width="113" height="14" rx="3" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.2"/>
  <text x="16" y="369" fill="#6B778C" font-size="9.5" class="mono">ensureActive() あり</text>
  <rect x="270" y="356" width="58" height="18" rx="9" fill="#36B37E"/><text x="299" y="369" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">≈106ms</text>
  <text x="334" y="369" fill="#6B778C" font-size="9.5">ほぼ期限どおりに停止</text>
  <rect x="150" y="380" width="550" height="14" rx="3" fill="#FFF7E6" stroke="#FFAB00" stroke-width="1.2"/>
  <text x="16" y="391" fill="#6B778C" font-size="9.5">確認なしの CPU ループ</text>
  <text x="425" y="392" text-anchor="middle" fill="#B26A00" font-size="10.5" font-weight="700">≈515ms  打ち切れず走り切る</text>
  <text x="150" y="408" text-anchor="middle" fill="#6B778C" font-size="8">0</text>
  <text x="700" y="408" text-anchor="end" fill="#6B778C" font-size="9">実時間 (ms)</text>
</svg>
