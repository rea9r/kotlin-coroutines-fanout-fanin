<svg width="760" height="384" viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A94A6"/></marker></defs>

  <text x="380" y="26" text-anchor="middle" fill="#42526E" font-size="13.5">スレッドとコルーチンを、1 つあたりのメモリと待ちのふるまいで比べる</text>

  <!-- panels -->
  <rect x="14"  y="42" width="354" height="330" rx="12" fill="none" stroke="#C1C7D0" stroke-width="1.2"/>
  <rect x="392" y="42" width="354" height="330" rx="12" fill="none" stroke="#C1C7D0" stroke-width="1.2"/>
  <text x="191" y="66" text-anchor="middle" fill="#42526E" font-size="13.5">スレッドだけ</text>
  <text x="569" y="66" text-anchor="middle" fill="#42526E" font-size="13.5">コルーチン</text>

  <!-- ===== Tier 1: per-unit memory (hero, single axis) ===== -->
  <text x="380" y="94" text-anchor="middle" fill="#97A0AF" font-size="9.5">メモリ使用量（1 つあたり）</text>

  <text x="40"  y="114" text-anchor="start" fill="#6B778C" font-size="10">スレッド 1 本</text>
  <rect x="40"  y="120" width="250" height="30" rx="6" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
  <text x="165" y="141" text-anchor="middle" fill="#1858B8" font-size="18">数 MB</text>

  <text x="418" y="114" text-anchor="start" fill="#6B778C" font-size="10">コルーチン 1 個</text>
  <rect x="418" y="120" width="28" height="30" rx="6" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.3"/>
  <text x="456" y="141" text-anchor="start" fill="#5243AA" font-size="18">約 10 KB</text>

  <text x="380" y="174" text-anchor="middle" fill="#6B778C" font-size="10.5">1 個あたりのメモリは、スレッドより桁違いに軽い</text>

  <line x1="40"  y1="190" x2="342" y2="190" stroke="#DFE1E6" stroke-width="1"/>
  <line x1="418" y1="190" x2="720" y2="190" stroke="#DFE1E6" stroke-width="1"/>

  <!-- ===== Tier 2: wait behavior (mechanism) ===== -->
  <text x="191" y="210" text-anchor="middle" fill="#8A5A00" font-size="10.5">待ちに入っても、スレッドを占有したまま</text>
  <text x="569" y="210" text-anchor="middle" fill="#186A3B" font-size="10.5">待ちに入ると、スレッドを手放す</text>

  <!-- LEFT: one thread per wait -->
  <g>
    <rect x="105" y="224" width="44" height="58" rx="6" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
    <rect x="111" y="235" width="32" height="36" rx="4" fill="#FFEAD1" stroke="#E8912B" stroke-width="1"/>
    <text x="127" y="257" text-anchor="middle" fill="#8A5A00" font-size="8">待ち</text>
    <rect x="169" y="224" width="44" height="58" rx="6" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
    <rect x="175" y="235" width="32" height="36" rx="4" fill="#FFEAD1" stroke="#E8912B" stroke-width="1"/>
    <text x="191" y="257" text-anchor="middle" fill="#8A5A00" font-size="8">待ち</text>
    <rect x="233" y="224" width="44" height="58" rx="6" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
    <rect x="239" y="235" width="32" height="36" rx="4" fill="#FFEAD1" stroke="#E8912B" stroke-width="1"/>
    <text x="255" y="257" text-anchor="middle" fill="#8A5A00" font-size="8">待ち</text>
  </g>
  <text x="191" y="304" text-anchor="middle" fill="#6B778C" font-size="10">1 つの待ちに 1 本ずつ要る</text>
  <text x="191" y="322" text-anchor="middle" fill="#6B778C" font-size="10">同時に動かせるのは 数千本 まで</text>

  <!-- RIGHT: many coroutines share few threads (M:N) -->
  <g>
    <rect x="460" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
    <rect x="492" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
    <rect x="524" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
    <rect x="556" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
    <rect x="588" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
    <rect x="620" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
    <rect x="652" y="222" width="26" height="13" rx="4" fill="#EAE6FF" stroke="#8777D9" stroke-width="1"/>
  </g>
  <path d="M505,238 L512,254" fill="none" stroke="#8A94A6" stroke-width="1.1" marker-end="url(#ar)"/>
  <path d="M569,238 L569,254" fill="none" stroke="#8A94A6" stroke-width="1.1" marker-end="url(#ar)"/>
  <path d="M633,238 L626,254" fill="none" stroke="#8A94A6" stroke-width="1.1" marker-end="url(#ar)"/>
  <rect x="464" y="256" width="90" height="22" rx="5" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
  <rect x="584" y="256" width="90" height="22" rx="5" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.3"/>
  <text x="509" y="271" text-anchor="middle" fill="#172B4D" font-size="9.5">スレッド</text>
  <text x="629" y="271" text-anchor="middle" fill="#172B4D" font-size="9.5">スレッド</text>
  <rect x="440" y="290" width="258" height="46" rx="6" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.3"/>
  <text x="569" y="308" text-anchor="middle" fill="#186A3B" font-size="10">待ちで手放すので、同じ数千本のスレッドで</text>
  <text x="569" y="326" text-anchor="middle" fill="#186A3B" font-size="10">桁違いに多くのコルーチンが動く</text>
</svg>
