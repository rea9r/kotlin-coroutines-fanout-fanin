<svg width="720" height="338" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
  <defs>
    <marker id="dn" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,1 L6,4 L0,7 z" fill="#4C9AFF"/></marker>
    <marker id="up" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,1 L6,4 L0,7 z" fill="#E8912B"/></marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" fill="#42526E" font-size="13">Job の親子ツリー</text>

  <!-- structure: middle edge stays plain gray; left = cancel(down, blue), right = failure(up, amber) -->
  <line x1="320" y1="94" x2="320" y2="158" stroke="#C1C7D0" stroke-width="1.3"/>
  <path d="M312,98 L120,154" fill="none" stroke="#4C9AFF" stroke-width="1.7" marker-end="url(#dn)"/>
  <text x="196" y="120" text-anchor="middle" fill="#1858B8" font-size="9">キャンセルは下へ</text>
  <path d="M520,154 L328,98" fill="none" stroke="#E8912B" stroke-width="1.7" marker-end="url(#up)"/>
  <text x="452" y="120" text-anchor="middle" fill="#B26A00" font-size="9">失敗は上へ</text>

  <!-- parent Job -->
  <rect x="230" y="46" width="180" height="48" rx="8" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.3"/>
  <text x="320" y="67" text-anchor="middle" fill="#5243AA" font-size="11.5">親 Job</text>
  <text x="320" y="82" text-anchor="middle" fill="#8A94A6" font-size="8.5">coroutineScope が作る</text>

  <!-- child Jobs -->
  <rect x="35"  y="158" width="150" height="48" rx="8" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.3"/>
  <text x="110" y="180" text-anchor="middle" fill="#5243AA" font-size="10.5">子 Job</text>
  <text x="110" y="195" text-anchor="middle" fill="#8A94A6" font-size="8.5">async user</text>
  <rect x="245" y="158" width="150" height="48" rx="8" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.3"/>
  <text x="320" y="180" text-anchor="middle" fill="#5243AA" font-size="10.5">子 Job</text>
  <text x="320" y="195" text-anchor="middle" fill="#8A94A6" font-size="8.5">async posts</text>
  <rect x="455" y="158" width="150" height="48" rx="8" fill="#EAE6FF" stroke="#8777D9" stroke-width="1.3"/>
  <text x="530" y="180" text-anchor="middle" fill="#5243AA" font-size="10.5">子 Job</text>
  <text x="530" y="195" text-anchor="middle" fill="#8A94A6" font-size="8.5">async notifications</text>

  <!-- caption -->
  <text x="320" y="240" text-anchor="middle" fill="#6B778C" font-size="10.5">親は全部の子が終わるまで完了しない。親のキャンセルは子へ（下向き）伝わる。</text>
  <text x="320" y="258" text-anchor="middle" fill="#6B778C" font-size="10.5">子の失敗（CancellationException 以外）は親へ（上向き）伝わり、親は残りをキャンセルして例外を外へ。</text>
</svg>
