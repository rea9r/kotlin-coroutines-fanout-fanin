<svg width="720" height="290" viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A94A6"/></marker>
  </defs>

  <!-- dashed group: the two branches have NO dependency between them -->
  <rect x="292" y="30" width="170" height="190" rx="12" fill="none" stroke="#57D9A3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="377" y="121" text-anchor="middle" fill="#186A3B" font-size="12.5" font-weight="600">依存なし</text>
  <text x="377" y="139" text-anchor="middle" fill="#186A3B" font-size="11">＝ 並行にできる</text>

  <!-- arrows -->
  <path d="M230,125 L298,73"  fill="none" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M230,125 L298,177" fill="none" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M450,73 L518,121"  fill="none" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M450,177 L518,129" fill="none" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- nodes -->
  <rect x="80" y="96" width="150" height="58" rx="9" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.5"/>
  <text x="155" y="131" text-anchor="middle" fill="#172B4D" font-size="16">ユーザー取得</text>
  <rect x="300" y="40" width="150" height="58" rx="9" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.5"/>
  <text x="375" y="75" text-anchor="middle" fill="#172B4D" font-size="16">投稿取得</text>
  <rect x="300" y="152" width="150" height="58" rx="9" fill="#E3FCEF" stroke="#57D9A3" stroke-width="1.5"/>
  <text x="375" y="187" text-anchor="middle" fill="#172B4D" font-size="16">通知取得</text>
  <rect x="520" y="96" width="150" height="58" rx="9" fill="#DEEBFF" stroke="#4C9AFF" stroke-width="1.5"/>
  <text x="595" y="131" text-anchor="middle" fill="#172B4D" font-size="16">画面を組み立て</text>

  <!-- legend -->
  <rect x="120" y="248" width="18" height="18" rx="4" fill="#DEEBFF" stroke="#4C9AFF"/>
  <text x="146" y="262" fill="#6B778C" font-size="13">依存でつながる部分（逐次）</text>
  <rect x="392" y="248" width="18" height="18" rx="4" fill="#E3FCEF" stroke="#57D9A3"/>
  <text x="418" y="262" fill="#6B778C" font-size="13">互いに依存しない部分（並行にできる）</text>
</svg>
