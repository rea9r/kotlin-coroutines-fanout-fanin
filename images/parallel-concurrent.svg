<svg width="720" height="416" viewBox="0 0 720 416" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans JP&quot;, Meiryo, sans-serif">
<defs><marker id="dn" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,1 L6,4 L0,7 z" fill="#8A94A6"/></marker></defs>
<text x="360" y="26" text-anchor="middle" fill="#42526E" font-size="13.5">並列（Parallel）と並行（Concurrent）</text>
<text x="20" y="126" text-anchor="middle" fill="#8A94A6" font-size="9">時間</text>
<line x1="20" y1="134" x2="20" y2="306" stroke="#8A94A6" stroke-width="1" marker-end="url(#dn)"/>
