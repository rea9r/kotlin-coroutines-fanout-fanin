</g>
<text x="360" y="372" text-anchor="middle" fill="#8A94A6" font-size="9">色＝1 つのコルーチン（同じ色＝中断して再開した同じもの）／グレーの縦線＝スレッド／縦＝時間の流れ／各パネルは独立した例</text>
<text x="360" y="393" text-anchor="middle" fill="#6B778C" font-size="10.5">待ちに入ったコルーチンはスレッドを手放し、その間、別のコルーチンが同じスレッドで動く——スレッドが<tspan fill="#8777D9" font-weight="700">1 本でも「並行」</tspan></text>
<text x="360" y="410" text-anchor="middle" fill="#6B778C" font-size="10.5">複数のスレッドに載せれば「並列かつ並行」。スレッドを増やさずに、切り替えるだけで足りる</text>
</svg>