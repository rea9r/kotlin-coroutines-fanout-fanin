<text x="350.0" y="98" text-anchor="middle" fill="#6B778C" font-size="9.5">1 本のスレッドが順に切り替える</text>
<text x="350.0" y="116" text-anchor="middle" fill="#6B778C" font-size="8">Thread 1</text>
<line x1="350.0" y1="122" x2="350.0" y2="306" stroke="#B3BAC5" stroke-width="1.4"/>
