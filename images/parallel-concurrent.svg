<line x1="328.0" y1="234" x2="372.0" y2="234" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9"/>
<line x1="328.0" y1="268" x2="372.0" y2="268" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9"/>
</g>
<line x1="372.0" y1="170" x2="384.0" y2="170" stroke="#8A94A6" stroke-width="1"/>
<text x="387.0" y="173" text-anchor="start" fill="#6B778C" font-size="8.5">待ちで中断</text>
<text x="350.0" y="332" text-anchor="middle" fill="#7A5AB8" font-size="9">コルーチンの「並行」はここ</text>
<rect x="464" y="44" width="240" height="312" rx="12" fill="none" stroke="#C1C7D0" stroke-width="1.2"/>
<text x="584.0" y="66" text-anchor="middle" fill="#42526E" font-size="12">並列かつ並行</text>
<text x="584.0" y="80" text-anchor="middle" fill="#8A94A6" font-size="8.5">Parallel and Concurrent</text>
<text x="584.0" y="98" text-anchor="middle" fill="#6B778C" font-size="9.5">複数のスレッドが、それぞれ切り替える</text>
<text x="532.0" y="116" text-anchor="middle" fill="#6B778C" font-size="8">Thread 1</text>
<line x1="532.0" y1="122" x2="532.0" y2="306" stroke="#B3BAC5" stroke-width="1.4"/>
